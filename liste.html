
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Liste — Le dernier rang</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

<header id="siteHeader"></header>


  <main class="list-page">
    <a class="back-link" href="profil.html">
      ← Retour à mon espace
    </a>

    <div id="listPageContent">
      <div class="film-loading">
        Chargement de la liste…
      </div>
    </div>
  </main>

  <footer>
    Le dernier rang · Les films que l’on garde près de soi.
  </footer>

  <!-- MODALE : connexion et inscription -->
  <div class="modal" id="authModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="authTitle">Bienvenue</h3>

        <button
          class="close-button"
          id="closeAuthModal"
          aria-label="Fermer"
        >
          ×
        </button>
      </div>

      <div class="auth-tabs">
        <button
          class="auth-tab active"
          type="button"
          data-auth-mode="login"
        >
          Se connecter
        </button>

        <button
          class="auth-tab"
          type="button"
          data-auth-mode="signup"
        >
          Créer un compte
        </button>
      </div>

      <div class="status-message" id="authMessage"></div>

      <form id="authForm">
        <div class="field" id="usernameField" hidden>
          <label for="username">Pseudo *</label>

          <input
            id="username"
            minlength="3"
            maxlength="30"
            placeholder="Ex. marioncinephile"
          />
        </div>

        <div class="field">
          <label for="authEmail">Adresse e-mail *</label>

          <input
            id="authEmail"
            type="email"
            required
            autocomplete="email"
            placeholder="vous@exemple.fr"
          />
        </div>

        <div class="field">
          <label for="authPassword">Mot de passe *</label>

          <input
            id="authPassword"
            type="password"
            required
            minlength="6"
            autocomplete="current-password"
            placeholder="Au moins 6 caractères"
          />
        </div>

        <button class="button-primary" type="submit" id="authSubmitButton">
          Se connecter
        </button>

        <p class="form-note" id="authNote">
          Connecte-toi pour retrouver ton carnet et tes listes.
        </p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/reviews.js"></script>
  <script src="assets/js/list.js"></script>
</body>
</html>
